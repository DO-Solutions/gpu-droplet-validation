{{- /*
Optional, default-off. ghcr packages are public so no pull secret is normally
needed. Rendered only when imagePullSecret.create is true AND a
dockerconfigjson is supplied — an escape hatch if the org makes the packages
private. Reference an existing secret instead via imagePullSecret.name.
*/ -}}
{{- if and .Values.imagePullSecret.create .Values.imagePullSecret.dockerconfigjson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecret.name | default (printf "%s-pull" (include "gdv.fullname" .)) }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.imagePullSecret.dockerconfigjson }}
{{- end }}
