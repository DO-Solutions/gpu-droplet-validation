# CPU-only mock stack — validates the k8s path itself without GPUs.
# Renders a Job with 4 plain initContainers (prereqs/setup/mock/teardown) +
# tap-reporter main: no GPU resources, no privileged, no hostIPC, no GPU taint.
#
#   helm template gdv deploy/helm/gpu-droplet-validation -f .../ci/amd-test-values.yaml
#   helm install  gdv deploy/helm/gpu-droplet-validation -f .../ci/amd-test-values.yaml \
#     --set runId=pass-ci-001            # pass-* | fail-* | error-* dispatch
gpuModel: test
gpuCount: 8
runId: pass-ci-001
image:
  version: latest
  pullPolicy: IfNotPresent
# Single Job, no node pinning — schedules anywhere (even a non-GPU node).
targetNodes: []
tolerations:
  gpuTaint: false
  allowCordoned: true
  extra: []
