# Ad-hoc: run NCCL all_reduce_perf once against a single GPU node to confirm
# the GPUs / NVLink fabric / config work at all. Standalone Pod — no Helm, no
# compose, no validation chain. This is DIAGNOSTIC ONLY: it runs the nccl-tests
# binary directly (overriding the image entrypoint), so there is NO pass/fail
# floor — the perf table + "Avg bus bandwidth" line in the logs are the signal.
#
# For a calibrated pass/fail run, use the full run.sh / compose flow on
# nvidia-b300 instead: the nccl-tests-nvidia entrypoint gates best-of-3
# busbw@8GB against NCCL_ALLREDUCE_FLOOR=810 GB/s (containers/_lib/nvidia_models.sh)
# and asserts NVLink transport. This example deliberately bypasses that
# entrypoint, so nvidia_models.sh / GPU_MODEL / floors are never consulted — and
# it works on any NVIDIA SKU, not just calibrated ones.
#
# Apply:   kubectl apply -f k8s/nccl-allreduce-adhoc.yaml
# Wait:    kubectl wait --for=condition=Ready pod/nccl-allreduce-adhoc --timeout=5m
# Watch:   kubectl logs -f pod/nccl-allreduce-adhoc       # primary signal (perf table on stdout)
# Clean:   kubectl delete -f k8s/nccl-allreduce-adhoc.yaml
#
# Retarget:
#  - alltoall instead of allreduce: change the command's binary to
#    /opt/nccl-tests/build/alltoall_perf (same flags).
#  - different GPU count: change BOTH the command's `-g N` AND
#    resources.limits.nvidia.com/gpu to N (they must match).
#
# NOTES
#  - The command flags mirror exactly what the suite's entrypoint runs
#    (containers/nccl-tests-nvidia/entrypoint.sh): -b 32K -e 8G -f 2 -g 8 -w 5 -n 20.
#  - The binary path /opt/nccl-tests/build/ is fixed by the pinned nccl-tests
#    image (ghcr.io/do-solutions/nccl-tests, mirrored upstream nvidia/nccl-tests);
#    it only moves on a deliberate base-image refresh. If a future image moves
#    it, the entrypoint's find_bin still locates it — drop the `command:`
#    override to fall back to the entrypoint (which then also applies the floor).
#  - hostIPC: true is required — NCCL uses single-node shared-memory transport.
#  - GPU access here is via the nvidia.com/gpu device plugin (installed by
#    default on DOKS GPU nodes). Unlike the AMD path there is no raw-device
#    fallback — the NVIDIA runtime injects /dev/nvidia*.
#  - Set nodeSelector hostname and NODE_ID to your actual node.
apiVersion: v1
kind: Pod
metadata:
  name: nccl-allreduce-adhoc
  labels:
    app: gpu-droplet-validation-scratch
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: CHANGEME-node            # <-- your GPU node
  tolerations:
    - key: nvidia.com/gpu                     # GPU node taint (DOKS sets an empty value, so match by key)
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/unschedulable  # node may be cordoned
      operator: Exists
      effect: NoSchedule
  hostIPC: true                              # NCCL single-node shared-mem transport
  containers:
    - name: nccl
      image: ghcr.io/do-solutions/gpu-droplet-validation/nccl-tests-nvidia:latest
      imagePullPolicy: Always
      # Run the nccl-tests binary directly instead of the image's entrypoint:
      # output streams to stdout (kubectl logs) and the Pod exits when it ends.
      # `-g` MUST match resources.limits.nvidia.com/gpu below.
      command:
        - /opt/nccl-tests/build/all_reduce_perf
        - -b
        - 32K
        - -e
        - 8G
        - -f
        - "2"
        - -g
        - "8"
        - -w
        - "5"
        - -n
        - "20"
      securityContext:
        capabilities:
          add: ["SYS_PTRACE"]
        seccompProfile:
          type: Unconfined
      env:
        - name: RUN_ID
          value: "nccl-allreduce-adhoc-001"
        - name: NODE_ID
          value: "CHANGEME-node"
      resources:
        limits:
          nvidia.com/gpu: 8
